name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip PyYAML
      - name: Validate sample simulator
        run: python simulator/monte_carlo/draw_probability.py
      - name: Validate YAML cards
        run: |
          python - <<'PY'
import glob, yaml
for path in glob.glob('game/cards/**/*.yaml', recursive=True):
    with open(path, 'r') as f:
        yaml.safe_load(f)
print('YAML validation complete')
PY
